services:
  - name: backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: PORT
        value: "3000"
      - key: DEMO_MODE
        sync: false
      - key: HF_MODEL
        sync: false
      - key: HF_ROUTER_URL
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HF_TTS_MODEL
        sync: false
      - key: TTS_PROVIDER
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
